# Cloudflare Tunnel — expose local pointsx-web as https://fitmeasureai.pp.ua
# without opening router ports. Domain DNS must be managed in Cloudflare.
#
# Setup (one-time):
#   brew install cloudflared
#   cloudflared tunnel login
#   cloudflared tunnel create fitmeasure-ai
#   ./deploy/setup-tunnel.sh
#   cp deploy/cloudflared.example.yml ~/.cloudflared/config.yml
#   # Edit tunnel: <TUNNEL-UUID> from: cloudflared tunnel list
#
# Run app + tunnel:
#   cd /path/to/PointsX && source .venv/bin/activate && pointsx-web --host 127.0.0.1 --port 8000
#   cloudflared tunnel run fitmeasure-ai

tunnel: <TUNNEL-UUID>
credentials-file: /Users/<YOU>/.cloudflared/<TUNNEL-UUID>.json

ingress:
  - hostname: fitmeasureai.pp.ua
    service: http://127.0.0.1:8000
  - service: http_status:404
