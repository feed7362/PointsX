# Nginx reverse proxy for PointsX web UI on fitmeasureai.pp.ua
# Install: sudo cp deploy/nginx-fitmeasureai.pp.ua.conf /etc/nginx/sites-available/fitmeasureai.pp.ua
#          sudo ln -s /etc/nginx/sites-available/fitmeasureai.pp.ua /etc/nginx/sites-enabled/
# TLS:     sudo certbot --nginx -d fitmeasureai.pp.ua
# Test:    sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name fitmeasureai.pp.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fitmeasureai.pp.ua;

    # certbot --nginx fills these paths after the first certificate issue
    ssl_certificate     /etc/letsencrypt/live/fitmeasureai.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitmeasureai.pp.ua/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
