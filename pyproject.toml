[project]
name = "pointsx"
version = "0.1.0"
description = "PyTorch research project with YOLO for point detection"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    # NumPy 2.x breaks many PyTorch wheels (torch C extension expects 1.x ABI).
    "numpy>=1.26.0,<2",
    "opencv-python>=4.9.0,<4.12",
    "matplotlib>=3.8.0",
    "pillow>=10.2.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "seaborn>=0.13.2",
    "scipy>=1.17.1",
    "smplx>=0.1.28",
    "fastapi>=0.115.0",
    # Imported directly by webui (schemas); was only pulled in through fastapi.
    "pydantic>=2.0",
    "uvicorn[standard]>=0.32.0",
    # smpl-anthropometry is not on PyPI — install manually:
    # pip install git+https://github.com/DavidBoja/SMPL-Anthropometry.git
    "rich>=15.0.0",
    "python-multipart>=0.0.26",
    "edge-tts>=7.0.0",
    # Demo-branch only: Cloudflare R2 archival for /api/measure. boto3 talks
    # to R2 via its S3-compatible endpoint. Silently noop'd when the R2_*
    # env vars are missing, so this is safe to ship on any deployment.
    "boto3>=1.35.0",
    # Sealed-box encryption for archived photos — same libsodium
    # scheme as the dataset flow (encrypt-only: needs the public key).
    "pynacl>=1.6.2",
    # Loads `.env` (gitignored) at webui startup so local dev doesn't need a
    # wrapper shell script. On HF Spaces / Docker the env is injected by the
    # platform and python-dotenv is a no-op.
    "python-dotenv>=1.0.0",
    # HF Hub for pulling model weights from a model repo (free, unlimited
    # public bandwidth + storage) instead of paying for S3 transfer.
    "huggingface_hub>=0.26.0",
    # Vercel proxy mode forwards /api/measure to the HF Space.
    "httpx>=0.27.0",
    "supabase>=2.31.0",
]

[project.optional-dependencies]
# Synthetic SMPL-X pipeline (vendored anthropometry). Blender (bpy, mathutils) is external, not pip-installable.
synthetic = ["trimesh>=4.0"]

[dependency-groups]
# Installed by `uv sync` by default: tests, lint, and the .vercelignore CI guard.
dev = ["pytest>=8.0", "ruff>=0.6", "pathspec>=0.12"]

[project.scripts]
pointsx = "pointsx.cli:main"
pointsx-web = "webui.__main__:main"
pointsx-eval = "pointsx.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pointsx", "src/webui"]

[tool.ruff]
line-length = 120
target-version = "py312"
